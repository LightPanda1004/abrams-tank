services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: abrams
      POSTGRES_USER: abrams
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run start-lan.sh first}
    volumes:
      - abrams-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abrams -d abrams"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgres://abrams:${POSTGRES_PASSWORD}@postgres:5432/abrams
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?Run start-lan.sh first}
      SERVER_API_TOKEN: ${SERVER_API_TOKEN:?Run start-lan.sh first}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Run start-lan.sh first},http://localhost:*,http://127.0.0.1:*
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3000/tcp"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  game-server:
    build:
      context: .
      dockerfile: Dockerfile.game-server
    environment:
      ABRAMS_LAN_DEDICATED_SERVER: "1"
      ABRAMS_LAN_SERVER_ID: lan-server-1
      ABRAMS_LAN_API_URL: http://api:3000
      ABRAMS_LAN_SERVER_HOST: ${LAN_HOST:?Run start-lan.sh first}
      ABRAMS_LAN_SERVER_PORT: 7777
      SERVER_API_TOKEN: ${SERVER_API_TOKEN:?Run start-lan.sh first}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "7777:7777/tcp"
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    volumes:
      - ../tankbattle(WebGL):/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80/tcp"
    restart: unless-stopped

volumes:
  abrams-postgres:
